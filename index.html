<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Your Language</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --blue: #2563eb;
            --blue-light: #60a5fa;
            --navy: #071329;
            --white: #ffffff;
            --muted: rgba(255, 255, 255, 0.68);
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(37, 99, 235, 0.35),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(14, 165, 233, 0.25),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #020617 0%,
                    #07152f 45%,
                    #0b2450 100%
                );

            overflow-x: hidden;

            position: relative;
        }

        /* Background glow */
        body::before,
        body::after {
            content: "";

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(2px);
        }

        body::before {
            width: 360px;
            height: 360px;

            top: -170px;
            left: -120px;

            background: rgba(37, 99, 235, 0.14);
        }

        body::after {
            width: 330px;
            height: 330px;

            right: -150px;
            bottom: -140px;

            background: rgba(56, 189, 248, 0.12);
        }

        .container {
            width: 100%;
            max-width: 650px;

            position: relative;
            z-index: 2;

            padding: 42px 42px 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.13),
                    rgba(255, 255, 255, 0.055)
                );

            border: 1px solid rgba(255, 255, 255, 0.16);

            border-radius: 28px;

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 35px 90px rgba(0, 0, 0, 0.48),
                inset 0 1px 0 rgba(255, 255, 255, 0.13);

            overflow: hidden;
        }

        /* Top accent line */
        .container::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #38bdf8,
                    #60a5fa,
                    #2563eb
                );
        }

        /* Decorative glow */
        .container::after {
            content: "";

            position: absolute;

            width: 210px;
            height: 210px;

            right: -110px;
            top: -110px;

            border-radius: 50%;

            background: rgba(59, 130, 246, 0.10);

            pointer-events: none;
        }

        .header {
            text-align: center;

            position: relative;
            z-index: 3;
        }

        .globe {
            width: 78px;
            height: 78px;

            margin: 0 auto 21px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(59, 130, 246, 0.25),
                    rgba(255, 255, 255, 0.08)
                );

            border: 1px solid rgba(147, 197, 253, 0.30);

            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);

            font-size: 38px;
        }

        h1 {
            color: var(--white);

            font-size: 30px;

            line-height: 1.2;

            font-weight: 750;

            letter-spacing: -0.7px;

            margin-bottom: 11px;
        }

        .subtitle {
            max-width: 410px;

            margin: 0 auto;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.6;
        }

        .language-row {
            margin-top: 34px;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 15px;

            position: relative;
            z-index: 3;
        }

        .language-card {
            width: 190px;
            min-height: 190px;

            padding: 24px 18px;

            border: 1px solid rgba(255, 255, 255, 0.18);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(241, 245, 249, 0.94)
                );

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            cursor: pointer;

            position: relative;

            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease;
        }

        .language-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 22px;
            right: 22px;

            height: 3px;

            border-radius: 0 0 8px 8px;

            background: #2563eb;

            opacity: 0.9;
        }

        .language-card:hover {
            transform: translateY(-7px);

            border-color: rgba(96, 165, 250, 0.65);

            box-shadow:
                0 25px 48px rgba(0, 0, 0, 0.34);
        }

        .language-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .language-card:focus-visible {
            outline: 3px solid rgba(96, 165, 250, 0.75);

            outline-offset: 5px;
        }

        .flag-wrapper {
            width: 70px;
            height: 70px;

            display: flex;

            justify-content: center;
            align-items: center;

            margin-bottom: 17px;

            border-radius: 50%;

            background: #f8fafc;

            box-shadow:
                0 8px 18px rgba(15, 23, 42, 0.12);

            border: 1px solid #e2e8f0;
        }

        .flag {
            font-size: 42px;

            line-height: 1;
        }

        .language-name {
            color: #0f1f42;

            font-size: 18px;

            font-weight: 750;

            letter-spacing: -0.2px;
        }

        .choose-text {
            margin-top: 6px;

            color: #64748b;

            font-size: 11px;

            font-weight: 650;

            letter-spacing: 0.35px;
        }

        .or {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.14);

            color: rgba(255, 255, 255, 0.68);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 0.5px;
        }

        .footer {
            margin-top: 31px;

            padding-top: 20px;

            border-top: 1px solid rgba(255, 255, 255, 0.10);

            text-align: center;

            position: relative;

            z-index: 3;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.48);

            font-size: 12px;

            letter-spacing: 0.2px;
        }

        .secure {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            margin-top: 10px;

            color: rgba(255, 255, 255, 0.38);

            font-size: 10px;

            letter-spacing: 0.4px;
        }

        .secure-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #60a5fa;

            box-shadow:
                0 0 10px rgba(96, 165, 250, 0.8);
        }

        @media (max-width: 560px) {

            body {
                padding: 16px;
            }

            .container {
                padding: 36px 17px 28px;

                border-radius: 24px;
            }

            h1 {
                font-size: 26px;
            }

            .subtitle {
                font-size: 14px;
            }

            .language-row {
                gap: 8px;
            }

            .language-card {
                width: 145px;
                min-height: 175px;

                padding: 20px 10px;
            }

            .flag-wrapper {
                width: 62px;
                height: 62px;

                margin-bottom: 15px;
            }

            .flag {
                font-size: 37px;
            }

            .language-name {
                font-size: 16px;
            }

            .choose-text {
                font-size: 10px;
            }

            .or {
                width: 29px;
                height: 29px;

                font-size: 9px;
            }
        }

        @media (max-width: 380px) {

            .container {
                padding-left: 12px;
                padding-right: 12px;
            }

            .language-card {
                width: 132px;
                min-height: 165px;
            }

            .flag-wrapper {
                width: 57px;
                height: 57px;
            }

            .flag {
                font-size: 34px;
            }

            .language-name {
                font-size: 15px;
            }

            .choose-text {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="header">

            <div class="globe">
                🌐
            </div>

            <h1>Choose Your Language</h1>

            <p class="subtitle">
                Select your preferred language to continue.
            </p>

        </div>


        <div class="language-row">

            <!-- English -->

            <button
                class="language-card"
                type="button"
                onclick="selectLanguage('en')">

                <span class="flag-wrapper">
                    <span class="flag">🇺🇸</span>
                </span>

                <span class="language-name">
                    English
                </span>

                <span class="choose-text">
                    Continue in English
                </span>

            </button>


            <span class="or">
                OR
            </span>


            <!-- Español -->

            <button
                class="language-card"
                type="button"
                onclick="selectLanguage('es')">

                <span class="flag-wrapper">
                    <span class="flag">🇲🇽</span>
                </span>

                <span class="language-name">
                    Español
                </span>

                <span class="choose-text">
                    Continuar en Español
                </span>

            </button>

        </div>


        <div class="footer">

            <div class="footer-text">
                Select one of the available languages below
            </div>

            <div class="secure">
                <span class="secure-dot"></span>
                Your language preference will be saved
            </div>

        </div>

    </main>


    <script>
        function selectLanguage(language) {

            // Save the selected language
            localStorage.setItem("language", language);

            // Continue to login page
            window.location.href = "login.html";
        }
    </script>

</body>

</html>
